:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F5F5F7;--ink:#111114;--ink-2:#46464D;--mute:#6B6B73;--soft:#8E8E96;--line:#E4E4E9;
  --logo:#1F2F6B;--brand:#111114;--brand-2:#2b2b31;--brand-ink:#FFFFFF;--tint:#F1F1F4;
  --dark:#F5F5F7;--on-dark:#111114;--on-dark-2:#46464D;--dark-line:#E0E0E6;
  --ok:#0F8A5F;--danger:#C8321E;--frame:#111114;
  --shadow:0 1px 2px rgba(17,17,20,.04),0 30px 60px -30px rgba(17,17,20,.3);
  --display:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --sans:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
#root{overflow-wrap:break-word;font:400 1.0625rem/1.68 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[id]{scroll-margin-top:88px}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;z-index:100}
.skip:focus{left:8px}

/* layout */
.container-x{width:100%;max-width:1200px;margin-inline:auto;padding-inline:22px}
@media(min-width:768px){.container-x{padding-inline:40px}}
.sec{padding-block:112px}
@media(max-width:767px){.sec{padding-block:72px}}
.sec-dark{background:var(--surface-2)}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:52px}
.sec-head .lead{margin:16px 0 0}

/* type */
.h-display{font:600 clamp(2.3rem,5.6vw,4.8rem)/1.06 var(--display);letter-spacing:-.04em;margin:0}
.h-display .soft{color:var(--soft)}
.h-1{font:600 clamp(2rem,4.2vw,3.4rem)/1.08 var(--display);letter-spacing:-.035em;margin:0}
.h-2{font:600 clamp(1.8rem,3.5vw,2.8rem)/1.1 var(--display);letter-spacing:-.033em;margin:0}
.h-3{font:600 1.2rem/1.3 var(--display);letter-spacing:-.015em;margin:0}
.lead{font-size:1.2rem;line-height:1.6;color:var(--ink-2);max-width:56ch;margin:0}
.mute{color:var(--mute)}
.fine{font-size:.9rem;color:var(--mute);margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;font:600 .96rem/1 var(--sans);padding:1rem 1.7rem;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.btn:active{transform:scale(.985)}
.btn-primary,.btn-tag{background:var(--brand);color:#fff}
.btn-primary:hover,.btn-tag:hover{background:var(--brand-2)}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-lg{padding:1.2rem 2.1rem;font-size:1.02rem}

/* price panel */

/* browser frame + mock */
.bframe{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}

.ms-btn.g{background:transparent;color:inherit;box-shadow:inset 0 0 0 .15cqw currentColor}

/* ================= BACKEND (demo) =================
   Üretimde bu nesnenin her metodu bir API çağrısıdır:
   upsert -> POST/PATCH /api/orders   |  get -> GET /api/orders/:id
   Şu an tarayıcıda localStorage'a yazar (yalnızca demo). Kart verisi ASLA buraya girmez. */
const mem={orders:[]};
/* Tahmin edilemez kimlik ve erişim anahtarları için kriptografik rastgelelik. */
/* Reddetmeli örnekleme: modulo yanlılığı yok. crypto yoksa güvensiz yedeğe düşmek yerine hata verir. */
const rand=n=>{const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n};
const token=(len=24)=>{const c="abcdefghijkmnpqrstuvwxyz23456789";let t="";for(let i=0;i<len;i++)t+=c[rand(c.length)];return t};
const Backend={
  /* Depodan gelen veri güvenilmez kabul edilir: biçimi bozuk kayıtlar elenir. */
  read(){let v=null;try{v=JSON.parse(localStorage.getItem("vitrin:orders")||"null")}catch(e){}const l=Array.isArray(v)?v:mem.orders;return l.filter(isRecord)},
  write(l){mem.orders=l;try{localStorage.setItem("vitrin:orders",JSON.stringify(l))}catch(e){}},
  /* Müşteriye gösterilen 6 haneli numara. Çakışma kontrol edilir; bu numara hiçbir zaman erişim anahtarı değildir. */
  newOrderNo(){const used=new Set(this.read().map(o=>o.orderNo));let n;do{n=String(100000+rand(900000))}while(used.has(n));return n},
  get(id){return this.read().find(o=>o.id===id)||null},
  /* Üretimde: GET /api/orders/by-token/:token (sunucu token'ın özetini karşılaştırır). */
  findByToken(t){return typeof t==="string"&&RX.token.test(t)?this.read().find(o=>o.accessToken===t)||null:null},
  async upsert(rec){await sleep(80);const l=this.read().filter(o=>o.id!==rec.id);l.unshift(rec);this.write(l);return rec}
};
const isRecord=r=>!!r&&typeof r==="object"&&typeof r.id==="string"&&RX.orderId.test(r.id)&&typeof r.orderNo==="string"&&!!r.customer&&!!r.business;
const buildRecord=o=>{
  const p=pricing(o.addons),i=o.info,c=(k,m)=>clean(i[k],m);
  return {
    id:o.id,orderNo:o.orderNo,accessToken:o.accessToken||null,pricingVersion:PRICING_VERSION,
    customer:{name:c("name",LIMITS.name),email:c("email",LIMITS.email),phone:c("phone",LIMITS.phone)},
    business:{brand:c("brand",LIMITS.brand),sector:SECTORS.includes(i.sector)?i.sector:"",site:c("site",LIMITS.url),instagram:c("instagram",LIMITS.handle),whatsapp:c("whatsapp",LIMITS.phone),wishes:c("wishes",LIMITS.wishes)},
    package:"temel",
    addons:p.list.map(a=>({id:a.id,name:a.name,price:a.price})),
    quoteRequests:QUOTE_ADDONS.filter(q=>(o.quotes||[]).includes(q.id)).map(q=>q.custom?{id:q.id,name:q.name,note:clean(o.customRequest,LIMITS.custom).trim()}:{id:q.id,name:q.name}),
    total:p.total,firstYearService:0,yearlyService:YEARLY,
    invoice:o.invoice,consents:o.consents||null,
    paymentStatus:o.status,paymentRef:o.paymentRef||null,
    projectStatus:o.project,createdAt:o.createdAt,
    contentForm:o.content||null
  };
};
/* Kayıttan sipariş durumunu geri kurar (sayfa yenilemesi ve erişim bağlantısı için). */
const recordToOrder=r=>{
  const paid=r.paymentStatus==="paid";
  const src={...r.customer,...r.business},info={...EMPTY_INFO};
  Object.keys(EMPTY_INFO).forEach(k=>{info[k]=clean(src[k],LIMITS.text)});
  const arr=v=>Array.isArray(v)?v:[];
  const qr=arr(r.quoteRequests),custom=qr.find(q=>q&&q.id==="ozel");
  return {
    info,
    addons:arr(r.addons).map(a=>a&&a.id).filter(id=>ADDONS.some(x=>x.id===id)),
    quotes:qr.map(q=>q&&q.id).filter(id=>QUOTE_ADDONS.some(x=>x.id===id)),
    customRequest:custom?clean(custom.note,LIMITS.custom):"",
    step:paid?4:3,id:r.id,orderNo:r.orderNo,accessToken:r.accessToken||null,
    /* Ödeme ortasında kapanan sekme: sonuç webhook ile netleşir; demoda tekrar denenebilir durumda açılır. */
    status:paid?"paid":"pending",project:PROJECT_STATUSES.includes(r.projectStatus)?r.projectStatus:null,createdAt:r.createdAt,
    invoice:{...EMPTY_INVOICE,...(r.invoice||{})},consents:r.consents||null,content:r.contentForm||null,paymentRef:r.paymentRef||null
  };
};

/* ================= ÖDEME SAĞLAYICI SOYUTLAMASI =================
   Üretimde: createSession -> POST /api/payments/session (sunucu, sağlayıcı API'sini çağırır)
   ve sağlayıcının barındırılan ödeme formu (hosted checkout / iframe) gösterilir.
   Kart bilgisi kendi sunucumuza veya state'imize ASLA yazılmaz. Sipariş "paid" durumuna
   yalnızca sağlayıcının webhook'u ile geçer.
   Buradaki confirm() sadece demo içindir: sağlayıcı formunu taklit eder. */
const PaymentProvider={
  id:"demo",
  async createSession(order){await sleep(450);return {sessionId:"sess_"+order.id}},
  async confirm(session,card){
    await sleep(1400);
    if(card.number.replace(/\s/g,"").endsWith("0002"))return {ok:false,reason:"Kartınız banka tarafından reddedildi. Başka bir kart deneyin."};
    return {ok:true,ref:"demo_"+session.sessionId};
  }
};

const DRAFT_TTL=7*24*60*60*1000;
const EMPTY_INVOICE={type:"bireysel",title:"",taxId:"",taxOffice:"",address:""};
const LS={
  get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},

const blankOrder=()=>({info:{...EMPTY_INFO},addons:[],quotes:[],customRequest:"",step:1,id:null,orderNo:null,accessToken:null,status:null,project:null,createdAt:null,invoice:{...EMPTY_INVOICE},consents:null,content:null,paymentRef:null});
/* keep verilirse yeni sipariş başlatılır; verilmezse önce açık sipariş, yoksa taslak yüklenir. */
const initOrder=(keep)=>{
  const o=blankOrder();
  if(keep){o.info={...o.info,...(keep.info||{})};return o}
  /* Taslak en fazla 7 gün tutulur; süresi geçen ya da bozuk taslak silinir. */
  let d=LS.get("vitrin:draft");
  if(d&&(typeof d!=="object"||!d.ts||Date.now()-d.ts>DRAFT_TTL||!d.info||typeof d.info!=="object")){LS.del("vitrin:draft");d=null}
  if(d){const inf={};Object.keys(EMPTY_INFO).forEach(k=>{inf[k]=clean(d.info[k],LIMITS.text)});d={...d,info:inf,
    addons:(Array.isArray(d.addons)?d.addons:[]).filter(id=>ADDONS.some(x=>x.id===id)),
    quotes:(Array.isArray(d.quotes)?d.quotes:[]).filter(id=>QUOTE_ADDONS.some(x=>x.id===id)),
    customRequest:clean(d.customRequest,LIMITS.custom)}}
  const activeId=LS.get("vitrin:active");
  const rec=activeId?Backend.get(activeId):null;
  if(rec){
    const r=recordToOrder(rec);
    /* Ödenmemiş siparişte taslak daha güncel olabilir (adım 1-2'de yapılan düzenlemeler). */
    if(r.status!=="paid"&&d)return {...r,info:{...r.info,...d.info},addons:d.addons,quotes:d.quotes,customRequest:d.customRequest};
    return r;
  }
  if(d)return {...o,info:{...o.info,...d.info},addons:d.addons,quotes:d.quotes,customRequest:d.customRequest};
  return o;
};

const splitHash=h=>{const raw=(h||"").replace(/^#/,"");const i=raw.indexOf("?");return {path:i<0?raw:raw.slice(0,i),q:new URLSearchParams(i<0?"":raw.slice(i+1))}};

const parseHash=h=>{try{const {path}=splitHash(h===undefined?location.hash:h);return ROUTES.includes(path)||DYN.some(r=>r.test(path))?path:(path&&path!=="/"?"/404":"/")}catch(e){return "/"}};

function AnimatedNumber({value}){
  const [v,setV]=useState(value);
  const shown=useRef(value);
  useEffect(()=>{
    const a=shown.current,b=value;
    if(a===b)return;
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){shown.current=b;setV(b);return}
    const t0=performance.now(),D=380;let raf;
    const step=t=>{const k=Math.min(1,(t-t0)/D);const e=1-Math.pow(1-k,3);shown.current=Math.round(a+(b-a)*e);setV(shown.current);if(k<1)raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf);
  },[value]);
  return money(v);
}

function Modal({title,onClose,wide,children}){
  const ref=useRef(null);
  useEffect(()=>{
    const prev=document.activeElement;
    const k=e=>{if(e.key==="Escape")onClose()};
    document.addEventListener("keydown",k);
    document.body.style.overflow="hidden";
    if(ref.current)ref.current.focus();
    return()=>{document.removeEventListener("keydown",k);document.body.style.overflow="";if(prev&&prev.focus)prev.focus()};
  },[]);
  return html`<div class="ovl" onMouseDown=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div class=${"mdl "+(wide?"wide":"")} role="dialog" aria-modal="true" aria-label=${title} tabIndex=${-1} ref=${ref}>
      <div class="mdl-h"><span>${title}</span><button class="iconbtn" onClick=${onClose} aria-label="Kapat"><${Icon} n="x"/></button></div>
      <div class="mdl-b">${children}</div>
    </div></div>`;

function StickyCTA(){
  const {startCheckout}=useApp();
  const [show,setShow]=useState(false);
  useEffect(()=>{
    const f=()=>{
      const ft=document.querySelector(".ftr");
      const nearEnd=ft&&ft.getBoundingClientRect().top<window.innerHeight;
      setShow(window.scrollY>window.innerHeight*0.9&&!nearEnd);
    };
    f();window.addEventListener("scroll",f,{passive:true});window.addEventListener("resize",f);
    return()=>{window.removeEventListener("scroll",f);window.removeEventListener("resize",f)};
  },[]);
  return html`<div class=${"sticky-cta "+(show?"on":"")} aria-hidden=${!show}>
    <div><b>${TL(BASE_PRICE)}</b><small>İlk yıl servis ücretsiz</small></div>

/* T.C. kimlik no algoritma kontrolü (10. ve 11. hane). Gerçek kişi doğrulaması değildir. */
const validTCKN=t=>{
  if(!/^[1-9]\d{10}$/.test(t))return false;
  const d=t.split("").map(Number);
  const d10=((d[0]+d[2]+d[4]+d[6]+d[8])*7-(d[1]+d[3]+d[5]+d[7]))%10;
  const d11=d.slice(0,10).reduce((a,b)=>a+b,0)%10;
  return ((d10+10)%10)===d[9]&&d11===d[10];
};
const fmtCard=v=>v.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();
const fmtExp=v=>{const d=v.replace(/\D/g,"").slice(0,4);return d.length>2?d.slice(0,2)+"/"+d.slice(2):d};

  const setInv=(k,v)=>{patch(o=>({invoice:{...o.invoice,[k]:v}}));if(errKey[k])fix(errKey[k])};
  /* Ardışık reddedilen denemelerden sonra kısa bekleme (sunucu tarafında da hız sınırı uygulanır). */
  const [fails,setFails]=useState(0);

  const [payErr,setPayErr]=useState("");

    const e={};

    if(card.number.replace(/\s/g,"").length!==16)e.cnum="16 haneli kart numarasını girin.";
    const m=/^(\d{2})\/(\d{2})$/.exec(card.exp);
    const now=new Date();
    if(!m||+m[1]<1||+m[1]>12||(2000+ +m[2])*12+ +m[1]<now.getFullYear()*12+now.getMonth()+1)e.cexp="Geçerli bir tarih girin.";

      if(inv.taxOffice.trim().length<2)e.ioffice="Vergi dairesini girin.";

        await Backend.upsert(buildRecord({...order,consents,status:"pending"}));

        else setPayErr(res.reason);
        return;
      }
      /* Proje formuna erişim anahtarı. Üretimde sunucu üretir, özetini saklar ve e-postayla gönderir. */

    </div>
  <//>`;

    aside=${summary} hint="Sıradaki adım: ödeme onaylandığında sipariş numaranızı alır ve içeriklerinizi göndereceğiniz forma geçersiniz.">
    <div class="panel">
      <h2 class="h-3">Ödeme Bilgileri</h2>
      <div class="demo-note"><${Icon} n="info" size=${18}/><span><b>Demo ortamı:</b> Gerçek ödeme alınmaz ve kart bilgileri hiçbir yere gönderilmez. Herhangi bir geçerli formatlı kart çalışır; 0002 ile biten kart reddedilir. Bireysel fatura için test T.C. kimlik no: 10000000146.</span></div>
      <${DemoCardForm} card=${card} setCard=${setCard} err=${err} fix=${fix}/>
    </div>
    <div class="panel">
      <h2 class="h-3" style=${{marginBottom:"14px"}}>Fatura Bilgileri</h2>
      <div class="seg" role="group" aria-label="Fatura türü">${[["bireysel","Bireysel"],["kurumsal","Kurumsal"]].map(t=>html`<button type="button" key=${t[0]} class=${inv.type===t[0]?"on":""} aria-pressed=${inv.type===t[0]} onClick=${()=>{if(inv.type!==t[0]){patch(o=>({invoice:{...o.invoice,type:t[0],taxId:"",taxOffice:""}}));setErr(x=>({...x,itax:undefined,ioffice:undefined}))}}}>${t[1]}</button>`)}</div>
      <${Field} id="i-title" label=${corp?"Şirket ünvanı":"Ad soyad"} error=${err.ititle}><${Inp} id="i-title" maxLength=${LIMITS.invTitle} value=${inv.title} onValue=${v=>setInv("title",v)} error=${err.ititle} placeholder=${corp?order.info.brand:order.info.name} autoComplete=${corp?"organization":"name"}/><//>
      ${corp?html`<div class="grid sm:grid-cols-2 gap-x-4">
        <${Field} id="i-tax" label="Vergi numarası" error=${err.itax}><${Inp} id="i-tax" inputMode="numeric" value=${inv.taxId} onValue=${v=>setInv("taxId",v.replace(/\D/g,"").slice(0,10))} error=${err.itax}/><//>
        <${Field} id="i-office" label="Vergi dairesi" error=${err.ioffice}><${Inp} id="i-office" maxLength=${LIMITS.taxOffice} value=${inv.taxOffice} onValue=${v=>setInv("taxOffice",v)} error=${err.ioffice}/><//>
      </div>`:html`<${Field} id="i-tax" label="T.C. kimlik numarası" error=${err.itax}><${Inp} id="i-tax" inputMode="numeric" value=${inv.taxId} onValue=${v=>setInv("taxId",v.replace(/\D/g,"").slice(0,11))} error=${err.itax}/><//>`}
      <${Field} id="i-addr" label="Fatura adresi" error=${err.iaddr}><textarea class="input" maxLength=${LIMITS.address} id="i-addr" style=${{minHeight:"84px"}} value=${inv.address} aria-invalid=${!!err.iaddr} onChange=${e=>setInv("address",e.target.value)}></textarea><//>

function AccessLink({t}){
  const [copied,setCopied]=useState(false);
  const url=accessUrl(t);
  const ref=useRef(null);
  const copy=async()=>{
    try{await navigator.clipboard.writeText(url);setCopied(true);setTimeout(()=>setCopied(false),2000)}
    catch(e){/* Pano izni yoksa metni seçili bırak: kullanıcı kendisi kopyalar. */
      const el=ref.current;if(el){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}}
  };
  return html`<div class="acc-link"><b>Proje formu bağlantınız</b>
    <code ref=${ref}>${url}</code>
    <div class="row"><button type="button" class="btn btn-line" style=${{padding:".6rem 1.1rem",fontSize:".88rem"}} onClick=${copy}>${copied?"Kopyalandı":"Bağlantıyı kopyala"}</button><span class="fine">Formu daha sonra bu bağlantıdan doldurabilirsiniz. Bu bağlantı e-postanıza da gönderilir. Bağlantı size özeldir, kimseyle paylaşmayın.</span></div>
  </div>`;
}

function Checkout(){
  const {order}=useApp();
  if(order.step===4&&order.status==="paid")return html`<${SuccessStep}/>`;
  if(order.step===3&&order.id)return html`<${PaymentStep}/>`;
  if(order.step===2)return html`<${PackageStep}/>`;
  return html`<${BusinessInfoStep}/>`;
}

/* ================= PROJE BAŞLANGIÇ FORMU ================= */
/* Dosyalar türe, boyuta ve adede göre süzülür. Sunucu, imzalı yüklemede aynı kuralları ve içerik taramasını uygular. */
function FileField({id,label,hint,accept,multiple,files,onFiles,types}){
  const [over,setOver]=useState(false);
  const [msg,setMsg]=useState("");
  const add=list=>{
    const a=Array.from(list||[]);if(!a.length)return;
    const okType=f=>(types||FILE_RULES.image).includes(f.type);
    const bad=a.filter(f=>!okType(f)),big=a.filter(f=>okType(f)&&f.size>FILE_RULES.maxSize);
    let good=a.filter(f=>okType(f)&&f.size<=FILE_RULES.maxSize);
    let next=multiple?[...files,...good]:good.slice(0,1);
    const cut=next.length>FILE_RULES.maxFiles;next=next.slice(0,FILE_RULES.maxFiles);
    const m=[];
    if(bad.length)m.push(bad.length+" dosya desteklenmeyen türde olduğu için eklenmedi.");
    if(big.length)m.push(big.length+" dosya 10 MB'tan büyük olduğu için eklenmedi.");
    if(cut)m.push("En fazla "+FILE_RULES.maxFiles+" dosya ekleyebilirsiniz.");
    setMsg(m.join(" "));
    if(good.length)onFiles(next);
  };
  const size=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
  return html`<div class="fld"><span class="label">${label}</span>
    <label class=${"drop "+(over?"over":"")} for=${id} onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);add(e.dataTransfer.files)}}>
      <${Icon} n="upload" size=${22}/><span><b>Dosya seçin</b> veya buraya sürükleyin</span><span class="fine">${hint}</span>
      <input id=${id} type="file" accept=${accept} multiple=${multiple} onChange=${e=>{add(e.target.files);e.target.value=""}}/>
    </label>
    ${msg&&html`<p class="ferr" role="alert">${msg}</p>`}
    ${files.length>0&&html`<ul class="flist">${files.map((f,i)=>html`<li key=${f.name+i}><span>${f.name} <span class="mute">(${size(f.size)})</span></span><button aria-label=${f.name+" dosyasını kaldır"} onClick=${()=>onFiles(files.filter((_,j)=>j!==i))}><${Icon} n="x" size=${16}/></button></li>`)}</ul>`}
  </div>`;
}
const STYLE_OPTS=[["Sade / Minimal","Az öğe, bol boşluk"],["Modern / Premium","Cesur tipografi, güçlü görseller"],["Kurumsal","Güven veren, düzenli"],["Renkli / Enerjik","Canlı renkler, hareketli his"],["Size bırakıyorum","Sektörüme uygun olanı seçin"]];

function ProjectOnboarding(){
  const {order,patch,go,openLegal}=useApp();
  const [f,setF]=useState({brand:order.info.brand,slogan:"",colors:[],about:"",services:"",products:"",phone:order.info.phone,email:order.info.email,address:"",hours:"",style:"",ref:""});
  const [files,setFiles]=useState({logo:[],biz:[],prod:[],team:[]});
  const done=!!order.content;
  const [err,setErr]=useState("");
  const [refErr,setRefErr]=useState("");
  const [startOk,setStartOk]=useState(false);
  const [startErr,setStartErr]=useState("");
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const setFl=k=>v=>setFiles(x=>({...x,[k]:v}));
  const t=hashParam("t");
  if(t&&t!==order.accessToken){
    /* Geçerli bağlantıda sipariş App içinde kayıttan yüklenir; bu arada boş kalır. */
    if(Backend.findByToken(t))return html`<main id="main" class="container-x co"></main>`;
    return html`<main id="main" class="container-x co"><div class="ok-wrap"><h1 class="h-1">Bu bağlantı geçerli değil.</h1><p class="lead" style=${{margin:"12px 0 24px"}}>Bağlantıyı e-postanızdan eksiksiz kopyaladığınızdan emin olun. Sorun sürerse sipariş numaranızla bize yazın.</p><button class="btn btn-primary btn-lg" onClick=${()=>go("/")}>Ana Sayfaya Dönün</button></div></main>`;
  }
  if(order.status!=="paid"){
    return html`<main id="main" class="container-x co"><div class="ok-wrap"><h1 class="h-1">Önce siparişinizi tamamlayın.</h1><p class="lead" style=${{margin:"12px 0 24px"}}>Proje başlangıç formu, ödeme tamamlandıktan sonra açılır.</p><button class="btn btn-primary btn-lg" onClick=${()=>go("/siparis")}>Siparişe Dön</button></div></main>`;
  }
  const submit=async()=>{
    if(f.brand.trim().length<2){setErr("Marka adını girin.");const el=document.getElementById("o-brand");if(el){el.focus()}return}
    if(!startOk){setStartErr("Göndermek için tasarım çalışmasının başlamasını onaylayın.");const el=document.getElementById("o-start");if(el)el.focus();return}
    setErr("");
    const names=k=>files[k].map(x=>({name:x.name,size:x.size}));
    if(f.ref.trim()&&!RX.url.test(f.ref.trim())){setErr("");setRefErr("Bağlantıyı https://ornek.com biçiminde girin.");const el=document.getElementById("o-ref");if(el)el.focus();return}
    setRefErr("");
    const txt={};Object.keys(f).forEach(k=>{txt[k]=k==="colors"?f.colors.filter(c=>/^#[0-9a-f]{6}$/i.test(c)).slice(0,4):clean(f[k],LIMITS.text).trim()});
    const content={...txt,style:STYLE_OPTS.some(o=>o[0]===f.style)?f.style:"",files:{logo:names("logo"),business:names("biz"),product:names("prod"),team:names("team")}};
    await Backend.upsert(buildRecord({...order,project:"Tasarım",content}));
    content.serviceStartConsentAt=new Date().toISOString();
    patch({project:"Tasarım",content});window.scrollTo({top:0});
  };
  if(done){
    return html`<main id="main" class="container-x co"><${Stepper} step=${4}/><div class="ok-wrap">
      <svg class="ok-ring" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46"/><path d="M28 50l14 14 27-30"/></svg>
      <h1 class="h-1">İçerikleriniz bize ulaştı.</h1>
      <p class="lead" style=${{margin:"12px 0 18px"}}>Tasarım sürecini başlatıyoruz. Sipariş numaranız <b>#${order.orderNo}</b>.</p>
      <p><span class="pill-s"><i></i>Proje durumu: ${order.project||"Tasarım"}</span></p>
      <p class="fine" style=${{margin:"18px 0 26px"}}>Proje aşamaları: ${PROJECT_STATUSES.join(", ")}.</p>
      <button class="btn btn-line btn-lg" onClick=${()=>go("/")}>Ana Sayfaya Dönün</button></div></main>`;
  }
  return html`<main id="main" class="container-x co"><${Stepper} step=${4}/>
    <div class="ob">
      <div class="co-head"><h1 class="h-1">Web siteniz için içerikleri alalım.</h1><p class="lead">Elinizdekileri gönderin, eksikleri sonra tamamlayabiliriz. Sipariş No: #${order.orderNo}</p></div>

      <div class="panel"><h2>Marka bilgileri</h2><p class="fine">Logonuz ve kimliğiniz sitenin temelini oluşturur.</p>
        <${FileField} id="o-logo" label="Logo" hint="PNG, JPG, SVG veya PDF, en fazla 10 MB" accept=".png,.jpg,.jpeg,.webp,.svg,.pdf" types=${FILE_RULES.logo} multiple=${false} files=${files.logo} onFiles=${setFl("logo")}/>
        <div class="grid sm:grid-cols-2 gap-x-4">
          <${Field} id="o-brand" label="Marka adı" error=${err}><${Inp} id="o-brand" value=${f.brand} onValue=${v=>set("brand",v)} error=${err}/><//>
          <${Field} id="o-slogan" label="Slogan" optional=${true}><${Inp} id="o-slogan" value=${f.slogan} onValue=${v=>set("slogan",v)}/><//>
        </div>
        <div class="fld"><span class="label">Marka renkleri <span class="opt">(isteğe bağlı)</span></span>
          <div class="swatches">${f.colors.map((c,i)=>html`<span class="sw" key=${i}><input type="color" value=${c} aria-label=${"Renk "+(i+1)} onChange=${e=>set("colors",f.colors.map((x,j)=>j===i?e.target.value:x))}/><button aria-label="Rengi kaldır" onClick=${()=>set("colors",f.colors.filter((_,j)=>j!==i))}><${Icon} n="x" size=${14}/></button></span>`)}
          ${f.colors.length<4&&html`<button class="btn btn-line" style=${{padding:".6rem 1rem"}} onClick=${()=>set("colors",[...f.colors,"#2340F2"])}><${Icon} n="plus" size=${16}/>Renk ekle</button>`}</div></div>
      </div>

      <div class="panel"><h2>İçerik</h2><p class="fine">Kısa ve net yazılar yeterli. Metni birlikte düzenleriz.</p>
        <${Field} id="o-about" label="Hakkımızda yazısı"><textarea class="input" maxLength=${LIMITS.text} id="o-about" value=${f.about} onChange=${e=>set("about",e.target.value)}></textarea><//>
        <${Field} id="o-serv" label="Hizmetler"><textarea class="input" maxLength=${LIMITS.text} id="o-serv" value=${f.services} onChange=${e=>set("services",e.target.value)}></textarea><//>
        <${Field} id="o-prod" label="Ürünler" optional=${true}><textarea class="input" maxLength=${LIMITS.text} id="o-prod" value=${f.products} onChange=${e=>set("products",e.target.value)}></textarea><//>
        <div class="grid sm:grid-cols-2 gap-x-4">
          <${Field} id="o-phone" label="Telefon"><${Inp} id="o-phone" type="tel" value=${f.phone} onValue=${v=>set("phone",v)}/><//>
          <${Field} id="o-mail" label="E-posta"><${Inp} id="o-mail" type="email" value=${f.email} onValue=${v=>set("email",v)}/><//>
        </div>
        <${Field} id="o-addr" label="Adres"><${Inp} id="o-addr" value=${f.address} onValue=${v=>set("address",v)} autoComplete="street-address"/><//>
        <${Field} id="o-hours" label="Çalışma saatleri" hint="Örnek: Hafta içi 09:00 - 18:00, Cumartesi 10:00 - 16:00"><${Inp} id="o-hours" value=${f.hours} onValue=${v=>set("hours",v)}/><//>
      </div>

      <div class="panel"><h2>Görseller</h2><p class="fine">Net ve yüksek çözünürlüklü fotoğraflar siteyi daha profesyonel gösterir.</p>
        <${FileField} id="o-biz" label="İşletme fotoğrafları" hint="JPG veya PNG, dosya başına en fazla 10 MB" accept="image/*" multiple=${true} files=${files.biz} onFiles=${setFl("biz")}/>
        <${FileField} id="o-prodf" label="Ürün fotoğrafları" hint="JPG veya PNG, dosya başına en fazla 10 MB" accept="image/*" multiple=${true} files=${files.prod} onFiles=${setFl("prod")}/>
        <${FileField} id="o-team" label="Ekip fotoğrafları" hint="JPG veya PNG, dosya başına en fazla 10 MB" accept="image/*" multiple=${true} files=${files.team} onFiles=${setFl("team")}/>
      </div>

      <div class="panel"><h2>Tasarım tercihi</h2><p class="fine">Hangisi size daha yakın?</p>
        <div class="stylegrid" role="radiogroup" aria-label="Tasarım tercihi">${STYLE_OPTS.map(s=>html`<label key=${s[0]} class=${"stylec "+(f.style===s[0]?"on":"")}><input type="radio" name="style" checked=${f.style===s[0]} onChange=${()=>set("style",s[0])}/><b>${s[0]}</b><small>${s[1]}</small></label>`)}</div>
        <div style=${{marginTop:"18px"}}><${Field} id="o-ref" label="Beğendiğiniz bir web sitesi varsa linkini paylaşabilirsiniz." optional=${true} error=${refErr}><${Inp} id="o-ref" maxLength=${LIMITS.url} value=${f.ref} onValue=${v=>{set("ref",v);setRefErr("")}} error=${refErr} placeholder="https://" inputMode="url"/><//></div>
      </div>
      <div class="panel"><h2>Onay</h2>
        <p class="fine">Siparişinizden itibaren 14 gün içinde ve çalışma başlamadan önce siparişinizi gerekçe göstermeden iptal edebilir, ödemenizin tamamını geri alabilirsiniz.</p>
        <label class="consent"><input type="checkbox" id="o-start" checked=${startOk} aria-invalid=${!!startErr} aria-describedby=${startErr?"o-start-e":null} onChange=${e=>{setStartOk(e.target.checked);setStartErr("")}}/><span>İçeriklerimi göndererek tasarım çalışmasının hemen başlamasını talep ediyorum. Çalışma başladıktan sonra cayma hakkımın sona ereceğini biliyorum. <button type="button" onClick=${()=>openLegal("mesafeli")}>Ayrıntılar</button></span></label>
        ${startErr&&html`<p class="err" id="o-start-e" role="alert">${startErr}</p>`}
        <p class="fine" style=${{marginTop:"10px"}}>Kişisel verileriniz, <button type="button" class="inl" onClick=${()=>openLegal("kvkk")}>KVKK Aydınlatma Metni</button> kapsamında işlenir.</p>
      </div>
      <div class="form-foot"><span class="fine">Bu önizlemede dosyalar yalnızca tarayıcınızda listelenir, gönderilmez.</span><button class="btn btn-primary btn-lg" onClick=${submit}>İçeriklerimi Gönder</button></div>
    </div></main>`;
}
/* ================= APP ================= */
function App(){
  const [hash,setHash]=useState(()=>location.hash);
  const route=parseHash(hash);
  const [order,setOrder]=useState(()=>initOrder());
  const [legal,setLegal]=useState(null);
  const pending=useRef(null);

  const flush=()=>{
    const s=pending.current;pending.current=null;
    if(s){const el=document.getElementById(s);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});return}}
    window.scrollTo({top:0});
  };
  const go=useCallback((path,section)=>{
    pending.current=section||null;
    try{if(location.hash!=="#"+path)history.pushState(null,"","#"+path)}catch(e){}
    setHash("#"+path);
    setTimeout(flush,60);
  },[]);
  useEffect(()=>{
    const f=()=>{setHash(location.hash);window.scrollTo({top:0})};
    window.addEventListener("popstate",f);window.addEventListener("hashchange",f);
    return()=>{window.removeEventListener("popstate",f);window.removeEventListener("hashchange",f)};
  },[]);
  useEffect(()=>{
    document.title=route==="/siparis"?"Sipariş | Vitrin":route==="/baslangic"?"Proje başlangıç formu | Vitrin":route==="/ucretlendirme"?"Ücretlendirme | Vitrin":route==="/neden"?"Neden web sitesi? | Vitrin":route==="/blog"?"Blog | Vitrin":route.startsWith("/blog/")?((BLOG.find(p=>"/blog/"+p.slug===route)||{}).title||"Blog")+" | Vitrin":route.startsWith("/yasal/")?((LEGAL_DOCS[route.slice(7)]||{}).t||"Yasal")+" | Vitrin":route==="/404"?"Sayfa bulunamadı | Vitrin":"Vitrin | "+money(BASE_PRICE)+" TL'ye profesyonel web sitesi";
  },[route]);
  /* Erişim bağlantısıyla gelindiyse siparişi kayıttan yükle. */
  useEffect(()=>{
    const t=hashParam("t",hash);
    if(route!=="/baslangic"||!t||t===order.accessToken)return;
    const rec=Backend.findByToken(t);
    if(rec)setOrder(recordToOrder(rec));
  },[hash]);
  /* Açık sipariş kimliği (kişisel veri içermez): yenilemede siparişi geri kurmak için. */
  useEffect(()=>{if(order.id)LS.set("vitrin:active",order.id);else LS.del("vitrin:active")},[order.id]);
  /* Taslak yalnızca ödeme öncesinde tutulur; ödeme sonrası silinir. */
  useEffect(()=>{if(order.status!=="paid")LS.set("vitrin:draft",{ts:Date.now(),info:order.info,addons:order.addons,quotes:order.quotes||[],customRequest:order.customRequest||""})},[order.info,order.addons,order.quotes,order.customRequest,order.status]);

  const patch=useCallback(p=>setOrder(o=>({...o,...(typeof p==="function"?p(o):p)})),[]);
  const startCheckout=useCallback((opts={})=>{
    setOrder(o=>{
      const base=o.status==="paid"?initOrder({info:o.info}):o;
      if(o.status==="paid"){base.addons=[];base.quotes=[];base.customRequest=""}
      return {...base,step:1,addons:opts.addons?opts.addons:base.addons};
    });
    go("/siparis");
  },[go]);

  const ctx={route,go,goSection:s=>go("/",s),order,patch,startCheckout,openLegal:setLegal};
  const co=route==="/siparis"||route==="/baslangic";
  return html`<${Ctx.Provider} value=${ctx}>
    ${co?html`<${CheckoutHeader}/>`:html`<${Header}/>`}
    ${route==="/"&&html`<${Home}/>`}
    ${route==="/neden"&&html`<${WhyPage}/>`}
    ${route==="/blog"&&html`<${BlogList}/>`}
    ${route.startsWith("/blog/")&&html`<${BlogPost} slug=${route.slice(6)}/>`}
    ${route.startsWith("/yasal/")&&html`<${LegalPage} id=${route.slice(7)}/>`}
    ${route==="/404"&&html`<${NotFound}/>`}
    ${route==="/ucretlendirme"&&html`<${PricingPage}/>`}
    ${route==="/siparis"&&html`<${Checkout}/>`}
    ${route==="/baslangic"&&html`<${ProjectOnboarding} key=${order.id||"none"}/>`}
    ${!co&&html`<${Footer}/>`}
    ${legal&&html`<${LegalModal} kind=${legal} onClose=${()=>setLegal(null)}/>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
